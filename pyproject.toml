[project]
name = "nber-cli"
version = "0.11.0"
description = "A command-line interface for accessing National Bureau of Economic Research (NBER) papers without a browser."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Song Tan", email = "sepinetam@gmail.com" },
]
license = "Apache-2.0"
keywords = [
    "nber",
    "working-papers",
    "cli",
    "mcp",
    "research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp",
    "fake_useragent",
    "certifi",
    "mcp[cli]>=1.27.1,<2",
    "defusedxml>=0.7.1",
    "sqlmodel>=0.0.24",
    "packaging>=26.2",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "alembic>=1.13",
]

[project.scripts]
nber-cli = "nber_cli:main"
nber-server = "nber_server.main:main"
nber-sidecar = "nber_server.main:main"

[project.urls]
Homepage = "https://github.com/sepinetam/nber-cli"
Repository = "https://github.com/sepinetam/nber-cli"
Issues = "https://github.com/sepinetam/nber-cli/issues"
Documentation = "https://sepinetam.github.io/nber-cli/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nber_cli", "src/nber_server"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.dev",
    "/.conductor",
    "/.superpowers",
    "/assets",
    "/build",
    "/dist",
    "/site",
    "/tmp",
    "/desktop/node_modules",
    "/desktop/src-tauri/target",
    "/desktop/src-tauri/binaries",
    "*.db",
    "*.log",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff==0.12.12",
    "mypy==2.2.0",
    "httpx>=0.27",
]
desktop-build = [
    "pyinstaller>=6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocs-static-i18n>=1.3.1",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]
